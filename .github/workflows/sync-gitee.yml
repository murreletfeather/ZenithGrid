name: Sync ZenithGrid from Gitee

on:
  schedule:
    - cron: '43 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-gitee
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted synchronization code
        uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false
      - name: Mirror source branches, tags and open pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: >-
          python .github/scripts/sync_gitee.py
          --repo-dir "$RUNNER_TEMP/zenithgrid-mirror.git"
